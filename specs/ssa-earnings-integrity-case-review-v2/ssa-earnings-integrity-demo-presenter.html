<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSA Earnings Integrity - 40-Minute Demo Companion</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
button, input { font: inherit; }
button { color: inherit; }
.app-shell { min-height: 100vh; font-size: calc(15px * var(--presenter-scale, 1)); }
.topbar { position: fixed; inset: 0 0 auto 0; min-height: 76px; z-index: 40; display: grid; grid-template-columns: minmax(250px, 1fr) auto auto; align-items: center; gap: 24px; padding: 10px 22px; background: var(--cp-panel-strong); border-bottom: 1px solid var(--cp-border); }
.brand-block, .header-metrics, .header-tools { display: flex; align-items: center; gap: 10px; }
.brand-block h1 { margin: 1px 0 0; font-size: 1.05rem; line-height: 1.2; letter-spacing: 0; }
.eyebrow, .section-kicker, .orientation-band span, .callout span, .status-language span, .transition span, .reference-section header > span { font-size: .67rem; font-weight: 700; letter-spacing: .08em; color: var(--cp-text-muted); }
.icon-button { width: 36px; height: 36px; display: inline-grid; place-items: center; padding: 0; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-surface); cursor: pointer; }
.icon-button:hover { border-color: var(--cp-border-strong); background: var(--cp-surface-soft); }
.danger-button:hover { color: var(--cp-danger); }
.primary-button, .secondary-button { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border-radius: .625rem; border: 1px solid var(--cp-accent); font-weight: 700; cursor: pointer; }
.primary-button { color: var(--cp-accent-fg); background: var(--cp-accent); }
.primary-button:hover { background: var(--cp-accent-hover); }
.secondary-button { background: var(--cp-surface); color: var(--cp-text); border-color: var(--cp-border); }
.metric { display: flex; flex-direction: column; line-height: 1.1; }
.metric span, .timer-readout span { color: var(--cp-text-muted); font-size: .68rem; }
.metric strong { font-size: .94rem; }
.timer-readout { min-width: 116px; display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-left: 1px solid var(--cp-border); }
.timer-readout div { display: flex; flex-direction: column; line-height: 1.05; }
.timer-readout strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.timer-readout.overtime { color: var(--cp-danger); }
.time-progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--cp-border); }
.time-progress span, .overall-progress span { display: block; height: 100%; background: var(--cp-accent); transition: width .25s ease; }
.mobile-menu, .nav-close { display: none; }

.section-nav { position: fixed; top: 76px; bottom: 0; left: 0; z-index: 30; width: 292px; display: flex; flex-direction: column; background: var(--cp-bg-elevated); border-right: 1px solid var(--cp-border); }
.nav-heading { min-height: 65px; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 11px; }
.nav-heading div { display: flex; flex-direction: column; }
.nav-heading span { color: var(--cp-text-muted); font-size: .66rem; font-weight: 700; letter-spacing: .08em; }
.nav-heading strong { margin-top: 2px; font-size: .92rem; }
.overall-progress { height: 4px; background: var(--cp-border); }
.section-nav nav { flex: 1; overflow-y: auto; padding: 8px; }
.nav-item { width: 100%; display: flex; gap: 10px; align-items: center; padding: 8px; margin: 0 0 2px; text-align: left; border: 1px solid transparent; border-radius: .625rem; background: transparent; cursor: pointer; }
.nav-item:hover { background: var(--cp-surface-soft); }
.nav-item.current { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
.nav-number { width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border: 1px solid var(--cp-border); border-radius: 50%; font-size: .7rem; font-weight: 700; color: var(--cp-text-muted); }
.nav-item.done .nav-number { color: var(--cp-accent-fg); background: var(--cp-success); border-color: var(--cp-success); }
.nav-copy { min-width: 0; display: flex; flex-direction: column; }
.nav-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .78rem; }
.nav-copy small { margin-top: 1px; color: var(--cp-text-muted); font-size: .66rem; }
.nav-footer { padding: 10px 14px 14px; border-top: 1px solid var(--cp-border); color: var(--cp-text-muted); font-size: .68rem; }
.nav-footer, .nav-footer div { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nav-footer button { padding: 0; border: 0; color: var(--cp-link); background: transparent; cursor: pointer; font-size: .68rem; }

.presenter-main { max-width: 1500px; margin-left: 292px; padding: 100px 28px 80px; }
.orientation-band { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 13px 18px; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; }
.orientation-copy { display: flex; align-items: center; gap: 12px; }
.orientation-copy p { margin: 2px 0 0; color: var(--cp-text-muted); font-size: .78rem; }
.status-dot { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 50%; background: var(--cp-success); }
.active-marker { display: flex; flex-direction: column; text-align: right; }
.active-marker strong { margin-top: 2px; font-size: .82rem; }
.guardrail-strip { display: flex; align-items: flex-start; gap: 12px; margin: 12px 0 22px; padding: 12px 16px; color: var(--cp-text); background: var(--cp-accent-soft); border-left: 4px solid var(--cp-accent); }
.guardrail-strip svg { flex: 0 0 auto; color: var(--cp-accent); }
.guardrail-strip div { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.guardrail-strip span { position: relative; font-size: .75rem; }
.guardrail-strip span::before { content: ""; width: 4px; height: 4px; display: inline-block; margin: 0 7px 2px 0; border-radius: 50%; background: var(--cp-accent); }

.demo-section { scroll-margin-top: 92px; margin-bottom: 16px; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; overflow: hidden; }
.demo-section.section-complete { border-color: var(--cp-success); }
.section-header { min-height: 118px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 16px 18px; }
.section-check { cursor: pointer; }
.section-check input, .action-item input { position: absolute; opacity: 0; pointer-events: none; }
.section-check > span { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--cp-border-strong); color: var(--cp-text-muted); font-size: .9rem; font-weight: 800; }
.section-complete .section-check > span { color: var(--cp-accent-fg); background: var(--cp-success); border-color: var(--cp-success); }
.section-title-button { min-width: 0; padding: 0; text-align: left; border: 0; background: transparent; cursor: pointer; }
.section-title-button h2 { margin: 3px 0 4px; font-size: 1.35rem; line-height: 1.2; letter-spacing: 0; }
.section-title-button p { max-width: 840px; margin: 0; color: var(--cp-text-muted); font-size: .85rem; }
.section-header-meta { display: flex; align-items: center; gap: 10px; color: var(--cp-text-muted); font-size: .76rem; }
.section-content { display: grid; grid-template-columns: minmax(320px, .85fr) minmax(440px, 1.15fr); gap: 28px; padding: 22px 24px 26px; border-top: 1px solid var(--cp-border); background: var(--cp-bg-elevated); }
.section-content h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 13px; color: var(--cp-text); font-size: .83rem; text-transform: uppercase; letter-spacing: .06em; }
.action-list { display: flex; flex-direction: column; gap: 7px; }
.action-item { position: relative; display: grid; grid-template-columns: 24px 1fr; align-items: start; gap: 9px; padding: 9px 10px; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-surface); cursor: pointer; line-height: 1.4; font-size: .82rem; }
.action-item:hover { border-color: var(--cp-border-strong); }
.custom-check { width: 20px; height: 20px; display: grid; place-items: center; margin-top: 1px; border: 1px solid var(--cp-border-strong); border-radius: 5px; }
.action-done { color: var(--cp-text-muted); background: var(--cp-surface-soft); }
.action-done .custom-check { color: var(--cp-accent-fg); background: var(--cp-success); border-color: var(--cp-success); }
.action-done > span:last-child { text-decoration: line-through; }
.speaker-notes { border-left: 4px solid var(--cp-accent); }
.speaker-notes blockquote { margin: 0; padding: 0 0 12px 16px; color: var(--cp-text); line-height: 1.58; font-size: .9rem; }
.speaker-notes blockquote::before { content: "“"; color: var(--cp-accent); font-weight: 800; }
.speaker-notes blockquote::after { content: "”"; color: var(--cp-accent); font-weight: 800; }
.callout, .status-language, .transition { margin-top: 12px; padding: 11px 13px; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-surface); }
.callout { border-left: 4px solid var(--cp-warning); }
.callout strong { display: block; margin-top: 3px; line-height: 1.45; font-size: .86rem; }
.status-language { border-left: 4px solid var(--cp-link); }
.transition { border-left: 4px solid var(--cp-accent); }
.status-language p, .transition p { margin: 3px 0 0; color: var(--cp-text-muted); font-size: .8rem; line-height: 1.45; }

.reference-section { margin-top: 38px; padding-top: 28px; border-top: 1px solid var(--cp-border); }
.reference-section header h2 { margin: 3px 0 3px; font-size: 1.35rem; letter-spacing: 0; }
.reference-section header p { margin: 0; color: var(--cp-text-muted); font-size: .84rem; }
.reference-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
.reference-panel { padding: 18px; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; }
.reference-panel h3 { margin: 0 0 12px; font-size: .95rem; }
.reference-panel details { padding: 9px 0; border-top: 1px solid var(--cp-border); }
.reference-panel details:first-of-type { border-top: 0; }
.reference-panel summary { cursor: pointer; font-weight: 700; font-size: .82rem; }
.reference-panel details p { margin: 7px 0 0; color: var(--cp-text-muted); font-size: .8rem; line-height: 1.5; }
.reference-panel ul { margin: 0; padding-left: 18px; }
.reference-panel li { margin-bottom: 10px; color: var(--cp-text-muted); font-size: .8rem; line-height: 1.45; }

.nav-scrim, .modal-backdrop { position: fixed; inset: 0; z-index: 50; border: 0; background: var(--cp-overlay); }
.modal-backdrop { display: grid; place-items: center; padding: 20px; }
.reset-dialog { width: min(420px, 100%); padding: 24px; text-align: center; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); box-shadow: var(--cp-shadow); }
.reset-dialog > svg { color: var(--cp-danger); }
.reset-dialog h2 { margin: 10px 0 5px; font-size: 1.15rem; }
.reset-dialog p { margin: 0; color: var(--cp-text-muted); font-size: .83rem; line-height: 1.5; }
.reset-dialog > div { display: flex; justify-content: center; gap: 9px; margin-top: 18px; }

@media (max-width: 1080px) {
  .topbar { grid-template-columns: 1fr auto; }
  .header-tools { display: none; }
  .section-content { grid-template-columns: 1fr; }
}

@media (max-width: 820px) {
  .topbar { min-height: 68px; padding: 8px 12px; gap: 10px; }
  .brand-block h1 { font-size: .88rem; }
  .eyebrow, .compact-metric { display: none; }
  .header-metrics { gap: 3px; }
  .timer-readout { min-width: 96px; padding: 4px 7px; }
  .primary-button { width: 38px; padding: 0; font-size: 0; }
  .primary-button svg { width: 18px; height: 18px; }
  .mobile-menu, .nav-close { display: inline-grid; }
  .section-nav { top: 0; z-index: 60; width: min(330px, 88vw); transform: translateX(-102%); transition: transform .2s ease; }
  .section-nav.nav-open { transform: translateX(0); }
  .nav-scrim { display: block; z-index: 55; }
  .presenter-main { margin-left: 0; padding: 84px 12px 56px; }
  .orientation-band { align-items: flex-start; flex-direction: column; gap: 9px; }
  .active-marker { text-align: left; }
  .guardrail-strip div { flex-direction: column; gap: 5px; }
  .section-header { min-height: 104px; grid-template-columns: auto 1fr; gap: 12px; padding: 14px; }
  .section-check > span { width: 42px; height: 42px; }
  .section-title-button h2 { font-size: 1.05rem; }
  .section-title-button p { font-size: .76rem; }
  .section-header-meta { grid-column: 2; justify-content: flex-end; margin-top: -8px; }
  .section-content { gap: 24px; padding: 18px 14px 21px; }
  .reference-grid { grid-template-columns: 1fr; }
}

@media print {
  .topbar, .section-nav, .orientation-band, .guardrail-strip, .section-header-meta, .reference-section { display: none; }
  .presenter-main { margin: 0; padding: 0; }
  .demo-section { break-inside: avoid; border-radius: 0; }
  .section-content { display: grid !important; }
}</style>

e hero case throughout the story.","Describe EIR-2025-0033 only according to the status shown live.","All people, amounts, records, and events are fictional demonstration data."],callout:"Start with the application ready, but do not begin inside the hero case."},{id:"opening",number:"01",title:"Opening and Positioning",minutes:2,purpose:"Frame the solution as one configurable example, not a prescribed SSA process.",actions:["Begin at the top of Earnings Integrity - Analyst Dashboard with the analyst banner, filters, and KPI row visible.","Leave filters at their defaults and keep My Investigations in its prepared state.","Do not open Hargrove or any other record during the positioning statement.","At the transition, move visual focus to the analyst identity banner without clicking."],notes:["Today I will walk through an earnings integrity case review experience that I built in Dynamics 365 Customer Service and Dataverse.","This is intentionally a concrete demonstration, not a claim that I have modeled SSA's final process.","Please focus on the pattern: structured work, connected evidence, guided review, human decisions, and measurable outcomes."],callout:"One working configuration makes the platform tangible; SSA discovery defines the operating model.",transition:"I will begin with the analyst's workload, zoom out to program oversight, and then follow one case from beginning to end."},{id:"agent-dashboard",number:"02",title:"Earnings Integrity - Analyst Dashboard",minutes:2,purpose:"Show the analyst's connected workload command center across cases, discrepancies, evidence, findings, and tasks.",actions:["Open Earnings Integrity - Analyst Dashboard.","Point to analyst identity, role, operational context, refresh, and updated time.","Show Search, Case Age, Risk Level, Review Phase, Evidence Status, and Review Type filters.","Scan all eight KPIs from Active Investigations through Open Exposure.","Expand My Investigations; identify the Hargrove link but leave it unopened for Step 04.","Point to Discrepancies, Evidence, Findings, Open Tasks, and Recent Case Activity sections."],notes:["This new web resource answers what work is active, what needs attention first, and which related evidence, findings, approvals, or tasks require action.","The filters and KPIs summarize connected operational records; SSA could align the dimensions to its approved workload model.","Expandable sections organize work by analyst need, while linked rows open the underlying Dataverse records when embedded in Dynamics.","The dashboard is a focused entry point, not a separate system of record."],callout:"The dashboard brings connected case work to the analyst and keeps every summary traceable to the underlying Dataverse record.",status:"Demonstrated: Dataverse workload assembly, filters, KPIs, connected work sections, and record navigation. Direct-file mode uses fictional preview data; SSA routing and access scope require configuration."},{id:"program-dashboard",number:"03",title:"Earnings Integrity Program Dashboard",minutes:2,purpose:"Move from individual workload to program-level operational oversight.",actions:["Open Earnings Integrity under Dashboards.","Point to open cases, pending approval, high/critical risk, exposure, resolved, and total case KPIs.","Show Cases by Risk Rating and Cases by Disposition.","Scan All Cases - Detail: risk, status, exposure, approval, and review type."],notes:["Leaders can see workload, pending approvals, risk concentration, estimated exposure, and disposition patterns without requesting a separate status report.","The numbers reflect fictional data loaded in this environment. They are not SSA production measures or proposed performance targets.","SSA could configure timeliness, aging, workload by office, evidence wait time, rework, supervisory returns, or approved quality measures."],callout:"The dashboard is a management view over the operational records, not a parallel reporting system.",transition:"Now I will move from the portfolio into the specific case that drives today's story."},{id:"case-selection",number:"04",title:"Workload and Hero Case Selection",minutes:2,purpose:"Explain intake, scale, and scenario variety before opening the hero case.",actions:["Open Cases and remain in the Active/My Cases view while explaining how the view organizes the analyst's workload.","Point out several EIR-2026 bulk cases to show volume and variation; do not open a record yet.","After explaining the view, search for EIR-2025-0041.","Open Hargrove, Robert - Unreported SSDI Wages Q1-Q2 2025 as the final action in this step."],notes:["Each row is an out-of-box Dynamics Case extended with earnings-integrity fields.","The additional records demonstrate repeatable patterns across unreported earnings, multiple employers, employer mismatch, and late reporting.","The Hargrove wage-match signal indicates $24,800 across two quarters while the beneficiary-reported amount is zero."],callout:"The suspicious wage signal opens structured work. It does not predetermine fraud, eligibility, debt, or disposition.",transition:"With the workload context established, I will open Hargrove and continue on the case Summary."},{id:"case-summary",number:"05",title:"Hero Case Summary, Navigation, and Guided Process",minutes:5,purpose:"Orient the audience to the open hero record, its navigation, and the guided lifecycle.",actions:["Begin with the generated Summary at the top; point to its AI-content caution, Copy, Translate, feedback, and refresh controls.","Show that Hargrove is open, then point to the case header: title, case number, current status, High priority, and owner.","Point to the visible active-case commands, including Refresh, Assign or routing actions, Add to Queue, the overflow menu, and Share as available.","Explain that if or when the case is resolved, it becomes read-only; an authorized user can reactivate it if more work is required.","Orient the audience to Intake, Risk & Confidence, Evidence & Workflow, Workbench, AI Insights, Review, Attachments, and Related.","Point to Intake Triage, Case Details, Risk Decision, Analysis, and Case Closure in the Business Process Flow.","On Intake, show Intake Classification and use the Timeline to establish the operational record beneath the summary."],notes:["The generated Summary gives a quick orientation to the prepared case, but the caution label matters: staff verify generated content against the underlying record.","Hargrove remains open for active review. Commands vary by status, role, and configuration.","Resolution protects the completed state by making the record read-only. Reactivation is an authorized path for additional work; it is not the current state of this hero case.","The form tabs organize the review while keeping case, evidence, findings, activities, and decisions connected in Dataverse.","The visible five-stage Business Process Flow is a configured demonstration baseline. Its labels and behavior do not claim a finalized SSA workflow.","The generated Summary supports orientation; the dedicated AI Insights tab later shows the scenario's more structured assistive-analysis pattern."],callout:"The summary accelerates orientation, the record preserves the facts, and the process guide makes the work repeatable."},{id:"risk-confidence",number:"06",title:"Risk and Confidence",minutes:3,purpose:"Show explainable prioritization while separating risk signals from decision authority.",actions:["Open Risk & Confidence.","Point to Risk Level, Fraud Risk Score, Fraud Likelihood, and Risk Explanation.","Point to Confidence Level and Confidence Score.","Show Potential Overpayment Estimate, Largest Monthly Variance, and Impacted Months."],notes:["Risk describes why a case may deserve attention. Confidence describes how strongly the available data supports the current assessment.","The Hargrove explanation references two quarters of zero reported earnings, verified wage data, employer confirmation, and a sustained pattern.","The scores and thresholds are demonstration choices. SSA could change the factors, require different review, or remove a score."],callout:"The score helps a person decide what to review first; it does not decide the case.",status:"Demonstrated: structured risk/confidence display. Production scoring requires approved logic, data validation, monitoring, explainability, and governance."},{id:"evidence-workflow",number:"07",title:"Evidence and Workflow",minutes:4,purpose:"Show how conflicting information is organized and how human oversight remains visible.",actions:["Open Evidence & Workflow.","Show evidence, identity validation, and beneficiary response status.","Show queue, human review, supervisor review, approval, recommended outcome, and final determination.","Show both Hargrove discrepancy records: $12,400 each.","Show W-2/tax record, beneficiary statement, and employer confirmation evidence.","Show the Investigation Finding pending supervisor action."],notes:["The top fields summarize what is complete and unresolved; related records preserve supporting detail.","One discrepancy record per period and employer makes the $24,800 total explainable and reportable.","The wage record and employer confirmation support the discrepancy. The beneficiary statement remains contradictory and under review.","Supervisor and human-review flags reflect this open demo workflow; SSA could define different approval paths."],callout:"The decision is explainable because discrepancy, evidence, finding, and human checkpoints remain connected to one case."},{id:"workbench",number:"08",title:"Analyst Case Workbench",minutes:3,purpose:"Show a purpose-built view that assembles the case without replacing source records.",actions:["Open Workbench.","Point to case header, status, type, days open, and total exposure.","Show Earnings Discrepancy Comparison.","Show Evidence Collection and verification details.","Walk the Case Progress Checklist through supervisor approval."],notes:["The embedded workbench reads related Dataverse records and presents the analyst's most important information in one compact view.","The underlying case, discrepancy, evidence, and finding records remain the system of record.","SSA could change the checklist, wording, order, level of detail, or provide a different view by role."],callout:"The workbench reduces navigation while preserving structured, auditable records underneath."},{id:"ai-insights",number:"09",title:"AI Insights with Human Guardrails",minutes:3,purpose:"Demonstrate assistive summarization and triage patterns with transparent limits.",actions:["Open AI Insights.","Show Case Summary, Supporting Evidence, Next Best Action, Risk Signals, Evidence Gaps, Confidence Rationale, Human Review Note, and Raw JSON.","Show the embedded Fraud AI Insights display and status label.","Point to Refresh Display.","Do not select Run AI Analysis unless the trigger was prevalidated."],notes:["The output is separated into inspectable sections instead of one unqualified paragraph.","Bulk-case content is explicitly seeded demonstration analysis. The build records ai_model_called = false for those values.","AI output does not determine fraud, eligibility, overpayment, escalation, or final disposition.","Production use requires approved models and prompts, security/privacy review, grounding, evaluation, monitoring, audit, and exception handling."],callout:"AI can organize the evidence and suggest the next question; accountable staff make the decision.",status:"Demonstrated: assistive display pattern. Seeded bulk values are not live model results, and production AI is not claimed."},{id:"agent-support",number:"10",title:"Specialized Agent and Frontline Support",minutes:3,purpose:"Show role-specific guidance and authoritative routing at the point of work without replacing policy or human judgment.",actions:["Open SSA Agent Support and show Linked Agents (3).","Explain that the agents can use approved website content to ground employee support.","Identify Earnings Fraud Navigator as subject-specific, NORA as broad organizational support, and General IT as technical support.","Select Federal Earnings Fraud Navigator and show the bounded response to the $24,000 question.","Point to relevant regulations/current guidance and the OIG or criminal-matter escalation distinction.","Switch to the purpose-built SSA Agent Fraud Support tab and show fraud guidance, OIG reporting, office lookup, official source, and call triage."],notes:["The agents can use approved website content to ground assistance and help employees find relevant information without searching disconnected pages.","The Earnings Fraud Navigator supports this subject specifically; NORA provides broad organizational guidance and general understanding; General IT handles technical support.","The navigator does not invent a special $24,000 threshold. It directs the employee to governing regulations, current SSA guidance, and appropriate escalation.","The response is not policy or legal authority. Staff rely on current approved sources and authorized decision makers.","The second tab is a purpose-built navigation page for frontline agents, with direct paths to fraud guidance, OIG reporting, office lookup, official sources, and call triage.","Conversational agents answer and route questions; the support page gives the employee a consistent path through the task."],callout:"Grounded agents help employees understand and find information; the support page helps them navigate the task. Neither creates policy nor decides the case.",status:"Demonstrated: website-grounded guidance, routing, and frontline navigation. Production requires approved sources, content ownership, freshness controls, access rules, evaluation, audit, and escalation boundaries.",transition:"With the evidence organized and the employee connected to the appropriate guidance, I will return to the structured finding and supervisor decision surface."},{id:"supervisor-review",number:"11",title:"Investigation Finding and Supervisor Review",minutes:4,purpose:"Complete the human decision path and show the supervisor's concise decision surface.",actions:["Close Agent Support, return to Hargrove, open Evidence & Workflow, and select the Investigation Finding.","Show Finding Type, Severity, Recommended Disposition, Approval Status, Analyst, and supporting detail.","Return to the case and open Review.","Show discrepancy records, evidence package, analyst recommendation, and pending approval.","Point to the supervisor decision options without selecting one."],notes:["The finding records what the analyst concluded, severity, recommended disposition, author, and supervisor status.","The Review tab assembles exposure, discrepancy records, evidence verification, and analyst recommendation.","The displayed supervisor options are demonstration choices, not a statement of SSA's required outcome taxonomy.","Hargrove remains open and pending so the demo stops immediately before the accountable human decision."],callout:"The system prepares the decision package; the supervisor owns the decision."},{id:"tasks-process",number:"12",title:"Tasks, Scale, and Process Improvement",minutes:3,purpose:"Show day-to-day follow-up work and the foundation for process-level improvement.",actions:["Return briefly to Earnings Integrity - Analyst Dashboard and point to Open Tasks.","Explain the 60 open tasks across 20 recent cases.","Name the three task types: Intake and Risk, Evidence Review, Follow-Up and Disposition.","Optionally open Process Events and show activity, timestamps, resource, queue/team, risk, evidence, outcome, and synthetic indicator."],notes:["A case review includes follow-up work, not only a form. Task categories and due-date logic are configurable.","The 12-case Process Mining cohort includes straight-through, evidence-loop, supervisor-return, reassignment, and escalation variants.","Those event rows are explicitly synthetic demonstration instrumentation, not reconstructed SSA history or production audit data."],callout:"The platform can manage today's work and provide evidence for improving tomorrow's process when event lineage is trustworthy."},{id:"configuration",number:"13",title:"Configuration and Production Path",minutes:2,purpose:"Prevent the demonstration from being mistaken for a final solution blueprint.",actions:["Restate that stages, labels, evidence categories, supervisor options, workbench layouts, and dashboards are examples.","Separate reusable platform capabilities from SSA-specific policy and operating-model design.","Name the production work: requirements, integrations, security/privacy, records, accessibility, performance, operations, governance, migration, and acceptance."],notes:["Dynamics and Dataverse provide cases, contacts, activities, ownership, teams, queues, forms, views, process guidance, relational data, security, auditing, packaging, and endpoints.","SSA discovery would define the domain configuration layered on top.","Production readiness requires requirement-by-requirement validation and governed engineering, not simply promoting the demo environment."],callout:"What is reusable is the platform pattern. What must be designed with SSA is the policy and operating model."},{id:"closing",number:"14",title:"Closing",minutes:2,purpose:"Summarize the connected pattern and end with a discovery question.",actions:["Recap workload, dashboard, Hargrove signal, guided review, risk, evidence, workbench, AI, Agent Support, finding, and supervisor package.","Restate structured records, visible human checkpoints, and measures that trace to operational work.","Repeat that this is one configuration built to make the conversation concrete.","Ask which process area SSA would most value mapping next."],notes:["We followed a $24,800 discrepancy from workload visibility through AI and point-of-work agent support to the complete supervisor decision package.","The demonstration shows connected records instead of disconnected notes and visible human checkpoints instead of autonomous decisions.","The next step is to use these screens to ask better questions about real intake paths, evidence authority, stages, decision rights, waiting, returns, and measures."],callout:"Which part of the current earnings integrity process would be most valuable to map next: intake and routing, evidence collection, supervisor review, or program visibility?"}],kg=["Fictional demonstration data only.","A wage signal is not a fraud determination.","AI assists; analysts and supervisors decide.","Agent guidance is not policy authority or adjudication.","Bulk AI values are seeded, not live model output.","Process Mining events are synthetic demo instrumentation.","The visible BPF is a multi-stage demonstration baseline."],Rg=[["Is this the process SSA should adopt?","No. It is one working configuration used to demonstrate capabilities and drive discovery."],["Is this production-ready?","No. Production requires validated requirements, integrations, security/privacy, records, accessibility, performance, operations, governance, migration, and acceptance testing."],["Is AI making the decision?","No. AI is positioned as assistive summarization and triage. Staff retain final authority."],["Are the dashboard numbers SSA metrics?","No. They are calculations over fictional demonstration data. SSA would define approved measures."],["Is Process Mining based on production history?","No. The enriched cohort is explicitly synthetic demonstration instrumentation."],["Can the screens and terminology change?","Yes. Forms, views, dashboards, labels, stages, queues, security, rules, and embedded experiences are configurable and solution-managed."]],Og=["Dashboard slow: use the Cases view and narrate the same workload dimensions.","Web resource blank: return to the related-record grids; records are evidence, the web resource is presentation.","BPF will not advance: do not edit the hero case live; explain the visible pattern and
